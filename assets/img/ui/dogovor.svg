<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Договор с фиксированной сметой">
  <!-- Иллюстрация договора: намеренно без текста, печатей и подписей —
       рисовать похожий на настоящий документ нельзя, а показать «цена в
       договоре зафиксирована» нужно. Читается формой: лист, строки сметы,
       выделенная строка «итого» и линия подписи. -->
  <rect width="640" height="400" fill="#efe9dd"/>

  <!-- задний лист -->
  <g transform="rotate(-4 300 210)">
    <rect x="150" y="52" width="300" height="330" rx="6" fill="#ffffff" opacity=".55" stroke="#dcd3c3"/>
  </g>

  <!-- основной лист -->
  <g>
    <rect x="182" y="38" width="300" height="330" rx="6" fill="#ffffff" stroke="#dcd3c3" stroke-width="1.5"/>

    <!-- шапка документа -->
    <rect x="210" y="70" width="128" height="12" rx="6" fill="#100e0b"/>
    <rect x="210" y="94" width="86" height="8" rx="4" fill="#dcd3c3"/>

    <!-- строки сметы -->
    <g fill="#e4d5bc">
      <rect x="210" y="132" width="180" height="8" rx="4"/>
      <rect x="210" y="156" width="214" height="8" rx="4"/>
      <rect x="210" y="180" width="160" height="8" rx="4"/>
      <rect x="210" y="204" width="196" height="8" rx="4"/>
    </g>
    <g fill="#dcd3c3">
      <rect x="404" y="132" width="50" height="8" rx="4"/>
      <rect x="404" y="156" width="50" height="8" rx="4"/>
      <rect x="404" y="180" width="50" height="8" rx="4"/>
      <rect x="404" y="204" width="50" height="8" rx="4"/>
    </g>

    <!-- итоговая строка: то самое «цена окончательная» -->
    <rect x="198" y="234" width="268" height="44" rx="4" fill="#100e0b"/>
    <rect x="214" y="252" width="96" height="9" rx="4.5" fill="rgba(246,242,234,.55)"/>
    <rect x="350" y="249" width="100" height="15" rx="4" fill="#e9ac52"/>

    <!-- подпись и дата -->
    <path d="M212 322c14-16 24-4 34-14s16-20 26-10 14 20 26 12 12-16 22-10"
          fill="none" stroke="#100e0b" stroke-width="3" stroke-linecap="round"/>
    <rect x="212" y="342" width="120" height="6" rx="3" fill="#dcd3c3"/>
    <rect x="366" y="342" width="88" height="6" rx="3" fill="#dcd3c3"/>
  </g>

  <!-- отметка «зафиксировано» -->
  <g transform="translate(430 296)">
    <circle r="34" fill="#d2501c"/>
    <path d="M-14 2l9 10 19-21" fill="none" stroke="#f6f2ea" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
