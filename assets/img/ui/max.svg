<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MAX">
  <!-- Фирменный знак мессенджера MAX: белый пузырь-кольцо на градиенте
       от голубого к фиолетовому. Внешний контур снят с официального
       favicon.svg с max.ru.

       Без масок и без id намеренно: знак вставляется в разметку в трёх
       местах сразу, и одинаковые id ломали маску — браузер брал первую
       и остальные копии превращались в белый квадрат. Кольцо собрано
       одним путём с fill-rule="evenodd": внешний контур и вырез в нём. -->
  <defs>
    <linearGradient id="maxGrad" x1="4" y1="96" x2="96" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23C4F0"/>
      <stop offset=".45" stop-color="#4B5BFF"/>
      <stop offset="1" stop-color="#B22BE8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="23" fill="url(#maxGrad)"/>
  <path fill="#fff" fill-rule="evenodd" d="
    M50.6 11.7C71.8 11.7 88.4 28.9 88.4 50.1C88.4 71.3 71.2 88.1 50.8 88.1
    C43.5 88.1 40.0 87.1 34.3 83.1
    C33.9 82.8 33.4 82.9 33.0 83.2
    C28.7 87.9 17.5 91.1 17.0 84.8
    C17.0 73.7 11.5 66.5 11.5 49.9
    C11.5 28.1 29.4 11.7 50.6 11.7 Z
    M50.9 32.5A17.5 17.5 0 1 0 50.9 67.5A17.5 17.5 0 1 0 50.9 32.5 Z"/>
</svg>
